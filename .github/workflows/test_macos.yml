name: Mach-O ARM64

on:
  push:
    paths:
      - "aic.py"
      - "aic_codegen_arm64.py"
      - "tools/aic_macho_emitter.py"
      - "tools/macos_runtime.py"
      - "tests/test_macos_arm64.py"
      - ".github/workflows/test_macos.yml"
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-14          # free Apple Silicon (M1) runner
    steps:
      - uses: actions/checkout@v4

      - name: Show Python/host
        run: |
          python3 --version
          uname -m

      - name: Structural + native Mach-O tests
        run: python3 tests/test_macos_arm64.py

      - name: Run a real program end to end
        run: |
          python3 aic.py build examples/08_visual_terminal_suite.aic \
            --target macho --arch arm64 -o /tmp/visual.macho
          chmod +x /tmp/visual.macho
          codesign -v /tmp/visual.macho
          /tmp/visual.macho
          python3 aic.py run examples/01_basics.aic --target macho --arch arm64
